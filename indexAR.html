<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Code Object Capture</title>
    <script>
        // Redirect to desktop mode if not mobile device
        (function() {
            const userAgent = navigator.userAgent.toLowerCase();
            const isMobileDevice = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(userAgent);
            const isTablet = /ipad|android(?!.*mobile)/i.test(userAgent);
            
            if (!isMobileDevice && !isTablet) {
                // Redirect to desktop mode
                window.location.href = 'index.html';
            }
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Mobile Layout */
        .mobile-container {
            width: 100%;
            background: #000;
            min-height: 100vh;
            position: relative;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.9);
        }

        .reset-btn {
            background: #8e8e93;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .next-btn {
            background: #8e8e93;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .next-btn.active {
            background: #007AFF;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* 3D Scan Screen */
        .scan-screen {
            text-align: center;
            color: white;
        }

        .scan-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .capture-area {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 20px auto;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
        }

        .capture-handles {
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
        }

        .handle-tl { top: -10px; left: -10px; }
        .handle-tr { top: -10px; right: -10px; }
        .handle-bl { bottom: -10px; left: -10px; }
        .handle-br { bottom: -10px; right: -10px; }
        .handle-t { top: -10px; left: 50%; transform: translateX(-50%); }
        .handle-b { bottom: -10px; left: 50%; transform: translateX(-50%); }
        .handle-l { left: -10px; top: 50%; transform: translateY(-50%); }
        .handle-r { right: -10px; top: 50%; transform: translateY(-50%); }

        .capture-instructions {
            margin: 20px 0;
            font-size: 14px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.8);
        }

        .start-capture-btn {
            background: #007AFF;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        /* 3D Modeling Screen */
        .modeling-screen {
            text-align: center;
            color: white;
        }

        .modeling-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .model-preview {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .model-placeholder {
            width: 200px;
            height: 200px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }

        .placement-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            border: 2px dashed white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* AR QR Codes Screen */
        .qr-screen {
            text-align: center;
            color: white;
            background: #1c1c1e;
            padding: 40px 20px;
        }

        .qr-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .success-message {
            margin-bottom: 30px;
        }

        .success-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .success-text {
            font-size: 14px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 10px;
        }

        .qr-code {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 15px;
            margin: 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .qr-pattern {
            width: 160px;
            height: 160px;
            background: 
                linear-gradient(90deg, #000 25%, transparent 25%),
                linear-gradient(0deg, #000 25%, transparent 25%);
            background-size: 20px 20px;
            border-radius: 10px;
        }

        .qr-logo {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #007AFF;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .view-ar-btn {
            background: #007AFF;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 auto;
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.9);
        }

        .footer-icon {
            width: 30px;
            height: 30px;
            background: #8e8e93;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
        }

        .progress-indicator {
            color: white;
            font-size: 14px;
        }

        /* Canvas */
        #ar-canvas {
            width: 100%;
            height: 100%;
            background: transparent;
        }

        /* Loading */
        .loading {
            display: none;
            color: white;
            font-style: italic;
            margin: 20px 0;
        }

        .loading.show {
            display: block;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff3b30;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        /* AR Mode Styles */
        .ar-mode {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 1000;
        }

        .ar-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1001;
        }

        .ar-btn {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .ar-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .ar-btn.primary {
            background: #007AFF;
        }

        .ar-btn.primary:hover {
            background: #0056b3;
        }

        /* AR Desktop-like Mode */
        .ar-desktop-mode {
            display: flex;
            height: calc(100vh - 60px);
            background: #000;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        /* Mobile Sidebar */
        .mobile-sidebar {
            width: 280px;
            background: #2c2c2e;
            border-right: 1px solid #3a3a3c;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            position: fixed;
            top: 60px;
            left: 0;
            height: calc(100vh - 60px);
            z-index: 1000;
        }

        .mobile-sidebar.show {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #3a3a3c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h3 {
            color: white;
            font-size: 18px;
            font-weight: 600;
        }

        .close-sidebar-btn {
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-sidebar-btn:hover {
            color: white;
        }

        .model-gallery {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .model-item {
            background: #3a3a3c;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .model-item:hover {
            background: #4a4a4c;
            transform: translateY(-2px);
        }

        .model-item.selected {
            border-color: #007AFF;
            background: #4a4a4c;
        }

        .model-thumbnail {
            width: 100%;
            height: 120px;
            background: #5a5a5c;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            overflow: hidden;
        }

        .model-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .model-info h4 {
            color: white;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .model-info p {
            color: #8e8e93;
            font-size: 12px;
            line-height: 1.4;
        }

        /* Mobile Main */
        .mobile-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.3s ease;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .mobile-main.sidebar-open {
            margin-left: 280px;
        }

        /* Hamburger Menu */
        .hamburger-menu {
            position: fixed;
            top: 80px;
            left: 20px;
            z-index: 1001;
            background: rgba(0, 0, 0, 0.8);
            border: none;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: all 0.3s ease;
        }

        .hamburger-menu span {
            width: 20px;
            height: 2px;
            background: white;
            transition: all 0.3s ease;
        }

        .hamburger-menu:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        /* Mobile Canvas Container */
        .mobile-canvas-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        #mobile-canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            background: transparent;
            max-width: 100%;
            margin: 0;
            padding: 0;
            cursor: grab;
            touch-action: none;
        }
        
        #mobile-canvas:active {
            cursor: grabbing;
        }

        /* Mobile Object Controls */
        .mobile-object-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            padding: 20px;
            min-width: 200px;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .mobile-object-controls.show {
            transform: translateX(0);
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            color: white;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #3a3a3c;
            outline: none;
            -webkit-appearance: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #007AFF;
            cursor: pointer;
        }

        .control-group input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #007AFF;
            cursor: pointer;
            border: none;
        }

        /* Mobile Controls Toggle */
        .mobile-controls-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 1001;
            transition: all 0.3s ease;
        }

        .mobile-controls-toggle:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.1);
        }

        /* AR Instructions */
        .ar-instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            z-index: 1000;
        }

        .instruction-text h3 {
            color: white;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .instruction-text p {
            color: #8e8e93;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .tracker-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .status-indicator {
            font-size: 20px;
            animation: pulse 2s infinite;
        }

        .status-text {
            color: white;
            font-size: 14px;
            font-weight: 500;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 16px;
            z-index: 1000;
            display: none;
        }

        .loading.show {
            display: block;
        }

        /* AR Performance Metrics */
        .ar-performance-metrics {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 139, 0.8);
            border-radius: 8px;
            padding: 8px 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .fps-counter {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }

        .fps-counter span {
            color: white;
            font-size: 12px;
            font-weight: 600;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
        }

        .performance-bar {
            width: 60px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .performance-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #ffff00, #ff0000);
            width: 100%;
            transition: width 0.3s ease;
        }

        /* AR Tracking Visualization */
        .ar-axis-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 500;
        }

        .axis-line {
            position: absolute;
            height: 2px;
            transform-origin: left center;
            opacity: 0.8;
        }

        .axis-x {
            background: #ff0000;
            width: 50px;
        }

        .axis-y {
            background: #00ff00;
            width: 50px;
            transform: rotate(90deg);
        }

        .axis-z {
            background: #0000ff;
            width: 50px;
            transform: rotate(45deg);
        }

        /* AR Object Overlay */
        .ar-object-overlay {
            position: absolute;
            pointer-events: none;
            z-index: 600;
            opacity: 0.7;
            mix-blend-mode: overlay;
        }

        .ar-stripe-overlay {
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 8px,
                #ffff00 8px,
                #ffff00 16px
            );
            border-radius: 4px;
        }


    </style>
</head>
<body>
    <!-- Mobile Layout -->
    <div class="mobile-container" id="mobile-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-left">
                <span id="mobile-time">1:02</span>
            </div>
            <div class="status-right">
                <span>📶</span>
                <span>4G</span>
                <span>🔋</span>
            </div>
        </div>

        <!-- AR Mode with Desktop-like Interface -->
        <div class="ar-desktop-mode" id="ar-desktop-mode">
            <!-- Sidebar -->
            <div class="mobile-sidebar" id="mobile-sidebar">
                <div class="sidebar-header">
                    <h3>Model Gallery</h3>
                    <button class="close-sidebar-btn" onclick="toggleMobileSidebar()">×</button>
                </div>
                <div class="model-gallery" id="mobile-model-gallery">
                    <!-- Model gallery will be populated by JavaScript -->
                </div>
            </div>

            <!-- Main AR Area -->
            <div class="mobile-main" id="mobile-main">
                <!-- Hamburger Menu -->
                <button class="hamburger-menu" id="mobile-hamburger-menu" onclick="toggleMobileSidebar()">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <!-- AR Canvas Container -->
                <div class="mobile-canvas-container" id="mobile-canvas-container">
                    <canvas id="mobile-canvas"></canvas>
                    
                    <!-- AR Tracking Visualization -->
                    <div class="ar-axis-lines" id="ar-axis-lines" style="display: none;">
                        <div class="axis-line axis-x" id="axis-x"></div>
                        <div class="axis-line axis-y" id="axis-y"></div>
                        <div class="axis-line axis-z" id="axis-z"></div>
                    </div>
                    
                    <!-- AR Object Overlay -->
                    <div class="ar-object-overlay ar-stripe-overlay" id="ar-object-overlay" style="display: none;"></div>
                    
                    <!-- Object Controls -->
                    <div class="mobile-object-controls" id="mobile-object-controls">
                        <div class="control-group">
                            <label>Scale:</label>
                            <input type="range" id="mobile-scale-slider" min="0.1" max="3" step="0.1" value="1" oninput="updateMobileScale(this.value)">
                        </div>
                        <div class="control-group">
                            <label>Rotation X:</label>
                            <input type="range" id="mobile-rotation-x" min="0" max="360" step="1" value="0" oninput="updateMobileRotation('x', this.value)">
                        </div>
                        <div class="control-group">
                            <label>Rotation Y:</label>
                            <input type="range" id="mobile-rotation-y" min="0" max="360" step="1" value="0" oninput="updateMobileRotation('y', this.value)">
                        </div>
                        <div class="control-group">
                            <label>Lighting:</label>
                            <input type="range" id="mobile-lighting-slider" min="0.1" max="2" step="0.1" value="1" oninput="updateMobileLighting(this.value)">
                        </div>
                        <div class="control-group">
                            <label>AR Features:</label>
                            <button onclick="toggleARFeatures()" id="ar-features-toggle">Show AR</button>
                        </div>
                    </div>

                    <!-- Controls Toggle -->
                    <button class="mobile-controls-toggle" id="mobile-controls-toggle" onclick="toggleMobileControls()">
                        ⚙️
                    </button>

                    <!-- AR Performance Metrics -->
                    <div class="ar-performance-metrics" id="ar-performance-metrics">
                        <div class="fps-counter">
                            <span id="fps-display">60 FPS (47-60)</span>
                            <div class="performance-bar">
                                <div class="performance-fill" id="performance-fill"></div>
                            </div>
                        </div>
                    </div>

                    <!-- AR Instructions -->
                    <div class="ar-instructions" id="ar-instructions">
                        <div class="instruction-text">
                            <h3>AR Mode Active</h3>
                            <p>Point your camera at a flat surface</p>
                            <p>Wait for tracker detection...</p>
                            <div class="tracker-status" id="tracker-status">
                                <span class="status-indicator">🔍</span>
                                <span class="status-text">Looking for tracker...</span>
                            </div>
                        </div>
                    </div>

                    <!-- Loading -->
                    <div class="loading" id="mobile-loading">Loading model...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification">
        AR mode activated!
    </div>


    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GLTFLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- WebXR Polyfill -->
    <script src="https://cdn.jsdelivr.net/npm/webxr-polyfill@2.0.3/build/webxr-polyfill.js"></script>
    <!-- WebXR Polyfill Configuration -->
    <script>
        // Configure WebXR polyfill
        if (typeof WebXRPolyfill !== 'undefined') {
            const polyfill = new WebXRPolyfill({
                allowCardboardOnDesktop: true,
